{% extends "base.html" %}
{% load static %}

{% block head %}
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
    .selection-container {
        width: 100%;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: 'Noto Sans KR', sans-serif;
    }

    .selection-title {
        font-family: 'Cinzel Decorative', serif;
        color: #ba9e7a;
        font-size: 2.5rem;
        margin-bottom: 40px;
        letter-spacing: 2px;
        text-shadow: 0 0 10px rgba(186, 158, 122, 0.3);
    }

    .map-grid {
        display: flex;
        gap: 30px;
        max-width: 900px;
        width: 100%;
        justify-content: center;
    }

    .map-card {
        background: #e6e5e2;
        border: 2px solid #ba9e7a;
        border-radius: 8px;
        width: 280px;
        padding: 30px 20px;
        text-align: center;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    .map-card:hover {
        transform: translateY(-5px);
        background: #e9e1cfd8;
        box-shadow: 0 0 15px #ba9e7a;
    }

    .map-icon {
        font-size: 2rem;
        color: #ba9e7a;
        margin-bottom: 15px;
    }

    .map-name {
        color: #746b60;
        font-size: 1.3rem;
        font-weight: bold;
        margin-bottom: 10px;
    }

    .map-desc {
        color: #8c7e6c;
        font-size: 0.9rem;
        line-height: 1.4;
    }
</style>
{% endblock %}

{% block content %}
{% include "UI.html" %}
<div class="selection-container">
    <h1 class="selection-title">SELECT REGION</h1>

    <div class="map-grid">
        {% for emap in maps %}
            <div class="map-card" onclick="location.href='{% url 'exploration:play_node' map_id=emap.id node_id=emap.start_node %}'">
                <div class="map-icon">✦</div>
                <div class="map-name">{{ emap.title }}</div>
                <div class="map-desc">탐색 구역 진입</div>
            </div>
        {% empty %}
            <p style="color: #8c7e6c;">현재 활성화된 탐색 구역이 없습니다.</p>
        {% endfor %}
    </div>
</div>
{% endblock %}
